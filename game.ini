; Cultures reconstruction - test build configuration.
; No original game data is bundled with this package. Copy your own legally
; owned Cultures: 8th Wonder "DataX" folder into this same folder (so this
; file sits next to DataX\Libs\data0001.lib) and the game finds it
; automatically. See README_TEST_BUILD.txt for details.
;
; IMPORTANT: DataX must be a real copy, not a shortcut/symlink/junction. A
; shortcut resolves outside this folder, and a safety check in the resource
; loader rejects it for security reasons - the game will then start into a
; black window. If you want to avoid duplicating the data on disk, uncomment
; the line below and set it to the FULL path of your own data0001.lib
; instead (this bypasses the same-folder requirement entirely):
; use_data_file_9=C:\path\to\your\DataX\Libs\data0001.lib
;
; If the game ever shows a black window instead of the menu, check
; startup.log in this folder - it explains what data could not be loaded.

gfx_screen_width=800
gfx_screen_height=600
gfx_screen_depth=16
gfx_fullscreen=0
gfx_fullscreen_toggle=1
tincat=1
